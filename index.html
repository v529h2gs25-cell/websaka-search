<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEBサカ 選手検索</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172338;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 16px}header{background:#102944;color:white;padding:28px 0}header h1{margin:0;font-size:26px}header p{opacity:.75;margin:8px 0 0}.panel{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:22px;margin:22px 0;box-shadow:0 5px 18px #1732500a}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input[type=search],input[type=number],select{width:100%;padding:12px;border:1px solid #cdd7e4;border-radius:10px;font-size:16px;background:white}.ranks{display:flex;gap:8px;flex-wrap:wrap}.rank{border:1px solid #d6deea;background:white;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.rank.active{border-color:#215eac;background:#e8f1ff}.rank[data-rank='金']{color:#a87600}.rank[data-rank='銀']{color:#657587}.rank[data-rank='銅']{color:#aa5a28}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.summary h2{font-size:18px;margin:0}.summary button{border:0;background:#e8edf4;padding:10px 13px;border-radius:10px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{background:white;border:1px solid #dfe7f0;border-radius:15px;padding:18px;display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}.player:hover{border-color:#447cba;box-shadow:0 3px 12px #1a47751b}.position{background:#eaf1f8;color:#315b80;padding:8px;border-radius:8px;font-weight:700;font-size:12px;min-width:39px;text-align:center}.name{font-weight:750}.meta{color:#697789;font-size:12px;margin-top:5px}.score{margin-left:auto;text-align:right;font-size:23px;font-weight:800;white-space:nowrap}.score small{display:block;font-size:11px;color:#778499;font-weight:400}.notice{font-size:13px;color:#64748b;line-height:1.6}.empty{text-align:center;padding:40px;color:#64748b}.import{margin-top:18px;font-size:13px}.import input{max-width:100%}footer{font-size:12px;color:#748296;margin:30px 0}@media(max-width:700px){.controls{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.wrap{padding:18px 12px}.panel{padding:16px}header h1{font-size:22px}}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbtn{border:1px solid #cbd8e7;border-radius:10px;background:white;padding:10px 14px;font-weight:700;cursor:pointer;color:#243b56}.toolbtn.selected{background:#e8f1ff;border-color:#215eac;color:#174f93}.fav{font-size:23px;border:0;background:transparent;color:#8999ad;cursor:pointer;padding:8px}.fav.saved{color:#d94d75}.pick{border:1px solid #b8c8da;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}.pick.picked{background:#215eac;color:white}.player{position:relative}.player-main{min-width:0;flex:1;display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}.player-main:hover .name{text-decoration:underline}.player-actions{display:flex;align-items:center;gap:4px}.comparison{overflow-x:auto}.comparison table{width:100%;border-collapse:collapse;min-width:400px}.comparison th,.comparison td{border-bottom:1px solid #e1e7ef;text-align:left;padding:11px}.comparison th{background:#edf3fa}.comparison a{color:#175aa2}.comparison .remove{border:0;background:transparent;color:#a02b41;cursor:pointer;font-size:18px}.help{color:#64748b;font-size:12px}.player .score{margin-left:0}@media(max-width:700px){.player{padding:11px;gap:5px}.player-main{gap:7px}.score{font-size:18px}.player-actions{gap:0}.fav{padding:5px}.pick{padding:6px}.name{font-size:14px}}

.positions{display:flex;flex-wrap:wrap;gap:8px}.posbtn{border:1px solid #cbd8e7;background:#fff;border-radius:10px;padding:11px 14px;font-weight:750;color:#41536b;cursor:pointer;min-width:56px}.posbtn.active{background:#e8f1ff;border-color:#215eac;color:#174f93}.posbtn:focus-visible,.rank:focus-visible,.toolbtn:focus-visible,.fav:focus-visible,.pick:focus-visible{outline:3px solid #f4ae42;outline-offset:2px}
@media(max-width:700px){header{padding:10px 0}header h1{font-size:21px}.wrap{padding:14px 12px}.panel{margin:12px 0;padding:14px;border-radius:14px}.controls{gap:13px}.cards{gap:9px}.player{padding:12px 10px;gap:8px;flex-wrap:wrap}.player-main{flex:1 1 100%;min-width:0;gap:10px}.player-actions{margin-left:auto;gap:8px}.name{font-size:15px;overflow-wrap:anywhere}.score{font-size:21px}.fav{min-width:42px;min-height:42px}.pick{min-height:42px;padding:7px 12px}.toolbar .toolbtn{flex:1 1 145px}.comparison{margin:0 -4px}.comparison th,.comparison td{padding:9px 7px;font-size:13px}.summary h2{font-size:16px}}
</style></head><body><header><div class="wrap"><h1>⚽ WEBサカ 選手検索</h1><p>偏差値 × ランク × 複数ポジションで選手を探そう · v3</p></div></header><main class="wrap"><section class="panel"><div class="controls"><div><label for="search">選手名</label><input id="search" type="search" placeholder="選手名を入力"></div><div><label for="min">最低偏差値</label><input id="min" type="number" value="50" min="0" max="100" step="0.01"></div><div><label>ポジション（複数選択可）</label><div class="positions" id="positions"><button type="button" class="posbtn active" data-pos="FW" aria-pressed="true">FW</button><button type="button" class="posbtn active" data-pos="MF" aria-pressed="true">MF</button><button type="button" class="posbtn active" data-pos="DF" aria-pressed="true">DF</button><button type="button" class="posbtn active" data-pos="GK" aria-pressed="true">GK</button></div></div><div><label>ランク（複数選択可）</label><div class="ranks" id="ranks"><button type="button" class="rank active" data-rank="金">🥇 金</button><button type="button" class="rank active" data-rank="銀">🥈 銀</button><button type="button" class="rank active" data-rank="銅">🥉 銅</button><button type="button" class="rank active" data-rank="無">無</button></div></div><div><label for="sort">並び替え</label><select id="sort"><option value="desc">偏差値が高い順</option><option value="asc">偏差値が低い順</option><option value="name">選手名順</option></select></div></div></section><div class="summary"><h2 id="count">検索結果</h2><button id="reset">条件をリセット</button></div><div class="toolbar"><button class="toolbtn" id="favoritesOnly" type="button">♡ お気に入りのみ (0)</button><button class="toolbtn" id="compareToggle" type="button">⇄ 比較する (0/3)</button></div><section class="panel" id="comparePanel" hidden><h2>選手比較（最大3人）</h2><div id="comparison" class="comparison"></div><p class="help">各選手カードの「＋比較」で追加できます。</p><button class="toolbtn" id="clearCompare" type="button">比較をクリア</button></section><p class="notice" id="status" role="status" aria-live="polite"></p><div class="cards" id="results"></div><section class="panel import"><strong>選手データの読み込み</strong><p class="notice">同じフォルダの players.json を自動読み込みします。毎週月曜日にデータ更新を試みます（取得失敗時は前回のデータを維持）。読み込めない場合のみ13ページ目のサンプルを表示します。JSONファイルを手動で読み込むこともできます。</p><input id="file" type="file" accept=".json,application/json"></section><footer>非公式ファンツール。データ出典：WEBサカWIKI（Rohm Report Team）。偏差値は掲載時点の値です。</footer></main><script>
const demo=[['シャザー','MF','銅',48.01],['ラブリー','FW','銅',48.91],['ガンプ','FW','金',51.86],['デ・フィーニオ','DF','銅',50.38],['ペコ・アルベニス','FW','銅',44.37],['雅乃　達美','FW','銅',43.75],['アデシダ','FW','金',52.63],['マクネアー','DF','銀',46.19],['ロビッチ','FW','銅',44.04],['パラミッチ','FW','銅',45.31],['マハリス','DF','銀',41.33],['飛松　孝彦','DF','銅',47.61],['オリベラ','MF','銅',48],['ロルダン','FW','銅',47.26],['ゲイファー','MF','銅',47.71],['ヒム・デリク','DF','銀',50.04],['ハリアー','MF','銅',49.92],['シラク','MF','銅',45.93],['ホフランド','DF','銀',48.04],['デ・コック','MF','銀',43.19],['ジルベルト・ソウザ','MF','銅',47.27]].map(([name,position,rank,score])=>({name,position,rank,score,page:13,url:'https://rohm.websoccer.info/player/list/normal/13'}));
let players=demo,full=false;
const $=id=>document.getElementById(id);
const active=new Set(['金','銀','銅','無']);
const activePositions=new Set(['FW','MF','DF','GK']);
const storageKey='websaka-favorites-v1';
let favorites=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(e){}
let compared=[],onlyFavorites=false,compareVisible=false;
const key=p=>`${p.page||0}|${p.position}|${p.rank}|${p.name}`;
const detail=p=>{try{const u=new URL(p.url||`https://rohm.websoccer.info/player/list/normal/${p.page||13}`);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}};
function saveFavorites(){try{localStorage.setItem(storageKey,JSON.stringify([...favorites]))}catch(e){alert('ブラウザにお気に入りを保存できませんでした')}}
function updateTools(){
 $('favoritesOnly').textContent=`${onlyFavorites?'♥':'♡'} お気に入りのみ (${favorites.size})`;
 $('favoritesOnly').classList.toggle('selected',onlyFavorites);
 $('compareToggle').textContent=`⇄ 比較する (${compared.length}/3)`;
 $('compareToggle').classList.toggle('selected',compareVisible);
 $('comparePanel').hidden=!compareVisible;
 renderComparison();
}
function renderComparison(){
 const el=$('comparison');el.replaceChildren();
 if(!compared.length){el.textContent='まだ比較する選手がいません。';return}
 const table=document.createElement('table');
 const rows=[['選手名',...compared.map(p=>p.name)],['偏差値',...compared.map(p=>Number(p.score).toFixed(2))],['ランク',...compared.map(p=>p.rank)],['ポジション',...compared.map(p=>p.position)]];
 rows.forEach((row,i)=>{const tr=document.createElement('tr');row.forEach((v,j)=>{const cell=document.createElement(i===0?'th':'td');if(i===0&&j>0){const a=document.createElement('a');a.href=detail(compared[j-1]);a.target='_blank';a.rel='noopener noreferrer';a.textContent=v;cell.append(a)}else cell.textContent=v;tr.append(cell)});table.append(tr)});
 const tr=document.createElement('tr');const head=document.createElement('td');head.textContent='操作';tr.append(head);
 compared.forEach(p=>{const td=document.createElement('td');const b=document.createElement('button');b.className='remove';b.textContent='× 外す';b.onclick=()=>{compared=compared.filter(x=>key(x)!==key(p));render()};td.append(b);tr.append(td)});table.append(tr);el.append(table)
}
function render(){
 const q=$('search').value.trim().toLowerCase(),min=Number($('min').value)||0,sort=$('sort').value;
 let found=players.filter(p=>p.score>=min&&active.has(p.rank)&&activePositions.has(p.position)&&p.name.toLowerCase().includes(q)&&(!onlyFavorites||favorites.has(key(p))));
 found.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ja'):sort==='asc'?a.score-b.score:b.score-a.score);
 $('count').textContent=`検索結果：${found.length}人 / ${players.length}人`;
 $('status').textContent=full?'全ページデータを読み込みました。選手名をタップすると元サイトが開きます。':'現在は13ページ目のサンプルデータのみ表示中です。';
 const container=$('results');container.replaceChildren();
 if(!found.length){const e=document.createElement('p');e.className='empty';e.textContent='条件に合う選手がいません';container.append(e)}
 for(const p of found){
  const article=document.createElement('div');article.className='player';
  const a=document.createElement('a');a.className='player-main';a.href=detail(p);a.target='_blank';a.rel='noopener noreferrer';a.title='元サイトで選手を見る';
  const badge=document.createElement('span');badge.className='position';badge.textContent=p.position;
  const info=document.createElement('div');const n=document.createElement('div');n.className='name';n.textContent=p.name;
  const m=document.createElement('div');m.className='meta';m.textContent=`${p.rank} ・ 掲載 ${p.page||'?'}ページ`;info.append(n,m);
  const s=document.createElement('div');s.className='score';s.textContent=Number(p.score).toFixed(2);
  const small=document.createElement('small');small.textContent='偏差値';s.append(small);a.append(badge,info,s);
  const actions=document.createElement('div');actions.className='player-actions';
  const fav=document.createElement('button');fav.type='button';fav.className='fav'+(favorites.has(key(p))?' saved':'');fav.textContent=favorites.has(key(p))?'♥':'♡';fav.title='お気に入りを切り替え';fav.setAttribute('aria-label',`${p.name}をお気に入り登録・解除`);
  fav.onclick=()=>{if(favorites.has(key(p)))favorites.delete(key(p));else favorites.add(key(p));saveFavorites();render()};
  const pick=document.createElement('button');pick.type='button';pick.className='pick'+(compared.some(x=>key(x)===key(p))?' picked':'');pick.textContent=compared.some(x=>key(x)===key(p))?'✓比較':'＋比較';pick.title='選手を比較に追加';
  pick.onclick=()=>{if(compared.some(x=>key(x)===key(p)))compared=compared.filter(x=>key(x)!==key(p));else if(compared.length>=3){alert('比較は最大3人です。先に誰かを外してください。');return}else compared.push(p);compareVisible=true;render()};
  actions.append(fav,pick);article.append(a,actions);container.append(article)
 }
 updateTools()
}
for(const id of ['search','min','sort'])$(id).addEventListener('input',render);
document.querySelectorAll('.posbtn').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.pos;if(activePositions.has(p)){activePositions.delete(p);b.classList.remove('active');b.setAttribute('aria-pressed','false')}else{activePositions.add(p);b.classList.add('active');b.setAttribute('aria-pressed','true')}render()}));
document.querySelectorAll('.rank').forEach(b=>b.addEventListener('click',()=>{const r=b.dataset.rank;if(active.has(r)){active.delete(r);b.classList.remove('active')}else{active.add(r);b.classList.add('active')}render()}));
$('reset').onclick=()=>{$('search').value='';$('min').value=50;activePositions.clear();document.querySelectorAll('.posbtn').forEach(b=>{activePositions.add(b.dataset.pos);b.classList.add('active');b.setAttribute('aria-pressed','true')});$('sort').value='desc';onlyFavorites=false;active.clear();document.querySelectorAll('.rank').forEach(b=>{active.add(b.dataset.rank);b.classList.add('active')});render()};
$('favoritesOnly').onclick=()=>{onlyFavorites=!onlyFavorites;render()};
$('compareToggle').onclick=()=>{compareVisible=!compareVisible;updateTools()};
$('clearCompare').onclick=()=>{compared=[];render()};
function load(data){if(!Array.isArray(data)||!data.every(p=>typeof p.name==='string'&&typeof p.score==='number'&&typeof p.position==='string'&&typeof p.rank==='string'))throw Error('選手データの形式が違います');players=data;full=true;compared=[];render()}
$('file').onchange=async e=>{try{if(e.target.files[0])load(JSON.parse(await e.target.files[0].text()))}catch(err){alert('読み込み失敗: '+err.message)}};
fetch('./players.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(load).catch(()=>{});render();
</script></body></html>
