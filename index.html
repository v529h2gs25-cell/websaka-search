<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEBサカ 選手検索</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172338;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 16px}header{background:#102944;color:white;padding:28px 0}header h1{margin:0;font-size:26px}header p{opacity:.75;margin:8px 0 0}.panel{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:22px;margin:22px 0;box-shadow:0 5px 18px #1732500a}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input[type=search],input[type=number],select{width:100%;padding:12px;border:1px solid #cdd7e4;border-radius:10px;font-size:16px;background:white}.ranks{display:flex;gap:8px;flex-wrap:wrap}.rank{border:1px solid #d6deea;background:white;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.rank.active{border-color:#215eac;background:#e8f1ff}.rank[data-rank='金']{color:#a87600}.rank[data-rank='銀']{color:#657587}.rank[data-rank='銅']{color:#aa5a28}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.summary h2{font-size:18px;margin:0}.summary button{border:0;background:#e8edf4;padding:10px 13px;border-radius:10px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{background:white;border:1px solid #dfe7f0;border-radius:15px;padding:18px;display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}.player:hover{border-color:#447cba;box-shadow:0 3px 12px #1a47751b}.position{background:#eaf1f8;color:#315b80;padding:8px;border-radius:8px;font-weight:700;font-size:12px;min-width:39px;text-align:center}.name{font-weight:750}.meta{color:#697789;font-size:12px;margin-top:5px}.score{margin-left:auto;text-align:right;font-size:23px;font-weight:800;white-space:nowrap}.score small{display:block;font-size:11px;color:#778499;font-weight:400}.notice{font-size:13px;color:#64748b;line-height:1.6}.empty{text-align:center;padding:40px;color:#64748b}.import{margin-top:18px;font-size:13px}.import input{max-width:100%}footer{font-size:12px;color:#748296;margin:30px 0}@media(max-width:700px){.controls{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.wrap{padding:18px 12px}.panel{padding:16px}header h1{font-size:22px}}
</style></head><body><header><div class="wrap"><h1>⚽ WEBサカ 選手検索</h1><p>偏差値 × ランク × ポジションで選手を探そう</p></div></header><main class="wrap"><section class="panel"><div class="controls"><div><label for="search">選手名</label><input id="search" type="search" placeholder="選手名を入力"></div><div><label for="min">最低偏差値</label><input id="min" type="number" value="50" min="0" max="100" step="0.01"></div><div><label for="position">ポジション</label><select id="position"><option value="">すべて</option><option>FW</option><option>MF</option><option>DF</option><option>GK</option></select></div><div><label>ランク（複数選択可）</label><div class="ranks" id="ranks"><button type="button" class="rank active" data-rank="金">🥇 金</button><button type="button" class="rank active" data-rank="銀">🥈 銀</button><button type="button" class="rank active" data-rank="銅">🥉 銅</button><button type="button" class="rank active" data-rank="無">無</button></div></div><div><label for="sort">並び替え</label><select id="sort"><option value="desc">偏差値が高い順</option><option value="asc">偏差値が低い順</option><option value="name">選手名順</option></select></div></div></section><div class="summary"><h2 id="count">検索結果</h2><button id="reset">条件をリセット</button></div><p class="notice" id="status"></p><div class="cards" id="results"></div><section class="panel import"><strong>選手データの読み込み</strong><p class="notice">初期状態では確認済みの13ページ目データを表示します。全56ページの検索には、付属の収集スクリプトで生成した players.json を同じフォルダに置き、Webサーバーで公開してください。JSONファイルを直接選択して読み込むこともできます。</p><input id="file" type="file" accept=".json,application/json"></section><footer>非公式ファンツール。データ出典：WEBサカWIKI（Rohm Report Team）。偏差値は掲載時点の値です。</footer></main><script>
const demo=[['シャザー','MF','銅',48.01],['ラブリー','FW','銅',48.91],['ガンプ','FW','金',51.86],['デ・フィーニオ','DF','銅',50.38],['ペコ・アルベニス','FW','銅',44.37],['雅乃　達美','FW','銅',43.75],['アデシダ','FW','金',52.63],['マクネアー','DF','銀',46.19],['ロビッチ','FW','銅',44.04],['パラミッチ','FW','銅',45.31],['マハリス','DF','銀',41.33],['飛松　孝彦','DF','銅',47.61],['オリベラ','MF','銅',48],['ロルダン','FW','銅',47.26],['ゲイファー','MF','銅',47.71],['ヒム・デリク','DF','銀',50.04],['ハリアー','MF','銅',49.92],['シラク','MF','銅',45.93],['ホフランド','DF','銀',48.04],['デ・コック','MF','銀',43.19],['ジルベルト・ソウザ','MF','銅',47.27]].map(([name,position,rank,score])=>({name,position,rank,score,page:13,url:'https://rohm.websoccer.info/player/list/normal/13'}));
let players=demo,full=false;const $=id=>document.getElementById(id);const active=new Set(['金','銀','銅','無']);function render(){const q=$('search').value.trim().toLowerCase(),min=Number($('min').value)||0,pos=$('position').value,sort=$('sort').value;let found=players.filter(p=>p.score>=min&&active.has(p.rank)&&(pos===''||p.position===pos)&&p.name.toLowerCase().includes(q));found.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ja'):sort==='asc'?a.score-b.score:b.score-a.score);$('count').textContent=`検索結果：${found.length}人 / ${players.length}人`;$('status').textContent=full?'全ページデータを読み込みました。':'現在は13ページ目の確認済みデータのみ表示中です（全56ページ未取得）。';$('results').replaceChildren();if(!found.length){const e=document.createElement('p');e.className='empty';e.textContent='条件に合う選手がいません';$('results').append(e)}for(const p of found){const a=document.createElement('a');a.className='player';a.href=p.url||`https://rohm.websoccer.info/player/list/normal/${p.page||13}`;a.target='_blank';a.rel='noopener noreferrer';const badge=document.createElement('span');badge.className='position';badge.textContent=p.position;const info=document.createElement('div');const n=document.createElement('div');n.className='name';n.textContent=p.name;const m=document.createElement('div');m.className='meta';m.textContent=`${p.rank} ・ 掲載 ${p.page||'?'}ページ`;info.append(n,m);const s=document.createElement('div');s.className='score';s.textContent=Number(p.score).toFixed(2);const small=document.createElement('small');small.textContent='偏差値';s.append(small);a.append(badge,info,s);$('results').append(a)}}for(const id of ['search','min','position','sort'])$(id).addEventListener('input',render);document.querySelectorAll('.rank').forEach(b=>b.addEventListener('click',()=>{const r=b.dataset.rank;if(active.has(r)){active.delete(r);b.classList.remove('active')}else{active.add(r);b.classList.add('active')}render()}));$('reset').onclick=()=>{$('search').value='';$('min').value=50;$('position').value='';$('sort').value='desc';active.clear();document.querySelectorAll('.rank').forEach(b=>{active.add(b.dataset.rank);b.classList.add('active')});render()};function load(data){if(!Array.isArray(data)||!data.every(p=>typeof p.name==='string'&&typeof p.score==='number'&&typeof p.position==='string'&&typeof p.rank==='string'))throw Error('選手データの形式が違います');players=data;full=true;render()}$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()))}catch(err){alert('読み込み失敗: '+err.message)}};fetch('./players.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(load).catch(()=>{});render();
</script></body></html>
