
name: Update WEBsaka players

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:17 UTC (12:17 JST)
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: websaka-player-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Collect players
        run: python collect.py

      - name: Check player count before publishing
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          data=json.loads(Path('players.json').read_text(encoding='utf-8'))
          if not isinstance(data,list) or len(data)<1000:
              raise SystemExit(f'Unexpected player count: {len(data) if isinstance(data,list) else "invalid"}; not publishing')
          print(f'Validated {len(data)} players')
          PYCODE

      - name: Collect formations
        run: python collect_formations.py

      - name: Check formation data before publishing
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          path=Path('formations.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data,list) or len(data)<3:
              raise SystemExit('Formation data missing or incomplete; not publishing')
          for formation in data:
              positions=formation.get('positions')
              if not isinstance(positions,list) or len(positions)!=11 or any(not isinstance(p,list) or not p for p in positions):
                  raise SystemExit(f'Invalid formation position data: {formation.get("id")}')
          print(f'Validated {len(data)} formations')
          PYCODE

      - name: Commit player and formation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add players.json formations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update WEBsaka player and formation data'
            git push
          fi
