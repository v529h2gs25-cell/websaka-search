WEBサカ選手検索 v3 — iPad/iPhone 更新手順

重要：現在GitHubにある collect.py と players.json は削除・上書きしないでください。

1. index.html を更新する
  Safariで https://github.com/v529h2gs25-cell/websaka-search を開きます。
  Add file → Upload files で、このZIPの index.html をアップロードします。
  既存ファイルと重複してアップロードできない場合は、既存index.htmlの編集画面で内容を差し替えるか、GitHub Webのgithub.dev編集画面で差し替えます。
  Commit changes で保存します。

2. 自動更新を設定する
  リポジトリの Code → .github → workflows → update-players.yml を開きます。
  鉛筆アイコンで編集し、このZIPの .github/workflows/update-players.yml の内容に置き換えます。
  Commit changes で保存します。
  ※GitHubの画面でファイル名が見つからなければ、Actions → Update WEBsaka players → Workflow file から開けます。

3. 動作確認
  Actions → Update WEBsaka players → Run workflow を一度手動実行。
  Collect players と Check player count before publishing が成功するか確認します。
  公開URL https://v529h2gs25-cell.github.io/websaka-search/ を開き、
  FW/MFなど複数ポジションを切り替え、お気に入りと比較も確認します。
  Safariに古い画面が残る場合は再読み込みしてください。

自動更新：毎週月曜日12:17頃（日本時間）。GitHub側の混雑などで遅れる場合があります。
収集先サイトの利用条件・robots・サーバー負荷を尊重してください。
