name: Update WEBsaka formations
on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 2'
permissions:
  contents: write
concurrency:
  group: websaka-formation-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pillow playwright
      - name: Install headless browser
        run: python -m playwright install --with-deps chromium
      - name: Collect formation batch
        env:
          FORMATION_BATCH: '3'
          FORMATION_PAUSE: '2.5'
        run: python collect_formations.py
      - name: Detect Wiki position coordinates
        env:
          LAYOUT_BATCH: '3'
        run: python collect_layouts.py
      - name: Validate before publishing
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          data=json.loads(Path('formations.json').read_text(encoding='utf-8'))
          assert isinstance(data,list) and data, 'No formations'
          assert all(len(f.get('positions',[]))==11 and all(isinstance(p,list) and p for p in f['positions']) for f in data), 'Incomplete formation'
          print('Validated',len(data),'formations')
          PYCODE
      - name: Commit formation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update WEBsaka formations'
            git pull --rebase
            git push
          fi
