name: Update WEBsaka formations
on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *' # Daily 13:27 JST
permissions:
  contents: write
concurrency:
  group: websaka-formation-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pillow playwright
      - name: Install headless browser
        run: python -m playwright install --with-deps chromium
      - name: Collect next formation batch
        env:
          FORMATION_BATCH: '5'
          FORMATION_PAUSE: '2.5'
        run: python collect_formations.py
      - name: Detect layouts (best effort)
        continue-on-error: true
        env:
          LAYOUT_BATCH: '3'
        run: python collect_layouts.py
      - name: Validate collected data
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          catalog=json.loads(Path('formations_catalog.json').read_text(encoding='utf-8'))
          assert isinstance(catalog,list) and catalog, 'Catalog is empty'
          p=Path('formations.json')
          if p.exists():
              data=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(data,list), 'Invalid formation data'
              assert all(len(f.get('positions',[]))==11 and all(isinstance(x,list) and x for x in f['positions']) for f in data), 'Incomplete formation data'
              print('Collected',len(data),'of',len(catalog),'formations')
          else:
              print('Catalog only; no complete formations yet')
          PYCODE
      - name: Commit catalog, progress and formation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formations_catalog.json formations_progress.json
          if [ -f formations.json ]; then git add formations.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Collect next WEBsaka formation batch'
            git pull --rebase
            git push
          fi
